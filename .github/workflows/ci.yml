name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install — the engine is zero-dependency.
      - name: Run test suite
        run: npm test
      - name: Headless evolution smoke test
        run: node bin/evolve.js --gens 5 --seed 1 --quiet

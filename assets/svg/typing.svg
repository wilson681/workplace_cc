<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" font-family="'Cascadia Code','Fira Code',Consolas,'Courier New',monospace" role="img" aria-label="terminal typing animation">
  <defs>
    <linearGradient id="t-iris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#ff5d8f"/>
    </linearGradient>
    <!-- one clip per line; width animates 0 -> text-width -> 0 to type & erase -->
    <clipPath id="cl0"><rect x="46" y="80" width="0" height="34">
      <animate attributeName="width" dur="14s" repeatCount="indefinite"
        keyTimes="0;0;0.086;0.186;0.229;1" values="0;0;346;346;0;0"/></rect></clipPath>
    <clipPath id="cl1"><rect x="46" y="80" width="0" height="34">
      <animate attributeName="width" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.25;0.336;0.436;0.479;1" values="0;0;302;302;0;0"/></rect></clipPath>
    <clipPath id="cl2"><rect x="46" y="80" width="0" height="34">
      <animate attributeName="width" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.5;0.586;0.686;0.729;1" values="0;0;331;331;0;0"/></rect></clipPath>
    <clipPath id="cl3"><rect x="46" y="80" width="0" height="34">
      <animate attributeName="width" dur="14s" repeatCount="indefinite"
        keyTimes="0;0.75;0.836;0.936;0.979;1" values="0;0;331;331;0;0"/></rect></clipPath>
  </defs>

  <!-- terminal card -->
  <rect x="1" y="1" width="558" height="148" rx="18" fill="#0a0c16" stroke="url(#t-iris)" stroke-opacity=".4"/>
  <rect x="1" y="1" width="558" height="148" rx="18" fill="#06070c" opacity=".25"/>

  <!-- title bar -->
  <circle cx="28" cy="28" r="5.5" fill="#ff5d8f"/>
  <circle cx="48" cy="28" r="5.5" fill="#f7a23b"/>
  <circle cx="68" cy="28" r="5.5" fill="#22d3ee"/>
  <text x="96" y="33" font-size="13" letter-spacing="1" fill="#6c7390">latent — ~/studio</text>
  <line x1="0" y1="52" x2="560" y2="52" stroke="#ffffff" stroke-opacity=".07"/>

  <!-- prompt + typed lines (all share one baseline, shown one at a time) -->
  <text x="24" y="104" font-size="25" font-weight="700" fill="#22d3ee">›</text>
  <text x="46" y="104" font-size="24" fill="#eef0f7" clip-path="url(#cl0)">emergence, rendered live</text>
  <text x="46" y="104" font-size="24" fill="#eef0f7" clip-path="url(#cl1)">four works, zero deps</text>
  <text x="46" y="104" font-size="24" fill="#eef0f7" clip-path="url(#cl2)">simple rules, wild form</text>
  <text x="46" y="104" font-size="24" fill="#eef0f7" clip-path="url(#cl3)">view source on anything</text>

  <!-- caret: x tracks the typing edge of whichever line is active; blinks on its own clock -->
  <rect y="84" width="11" height="26" rx="1.5" fill="#22d3ee">
    <animate attributeName="x" dur="14s" repeatCount="indefinite"
      keyTimes="0;0.086;0.186;0.229;0.25;0.336;0.436;0.479;0.5;0.586;0.686;0.729;0.75;0.836;0.936;0.979;1"
      values="46;392;392;46;46;348;348;46;46;377;377;46;46;377;377;46;46"/>
    <animate attributeName="opacity" dur="1.06s" repeatCount="indefinite"
      calcMode="discrete" keyTimes="0;0.5;1" values="1;0.15;1"/>
  </rect>

  <!-- subtle bottom hint -->
  <text x="536" y="134" text-anchor="end" font-size="11" letter-spacing="2" fill="#5a607b">LATENT.STUDIO</text>
</svg>

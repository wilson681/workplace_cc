<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-label="LATENT — a generative art studio">
  <defs>
    <!-- iridescent spectrum -->
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"  stop-color="#7c5cff"/>
      <stop offset=".4" stop-color="#22d3ee"/>
      <stop offset=".72" stop-color="#f7a23b"/>
      <stop offset="1"  stop-color="#ff5d8f"/>
    </linearGradient>

    <!-- moving sheen used to fill the wordmark -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0"   stop-color="#7c5cff"/>
      <stop offset=".28" stop-color="#22d3ee"/>
      <stop offset=".5"  stop-color="#ffffff"/>
      <stop offset=".72" stop-color="#f7a23b"/>
      <stop offset="1"   stop-color="#ff5d8f"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="blobV" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".9"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".8"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f7a23b" stop-opacity=".7"/><stop offset="1" stop-color="#f7a23b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobR" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5d8f" stop-opacity=".7"/><stop offset="1" stop-color="#ff5d8f" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="round"><rect x="0" y="0" width="1280" height="440" rx="22"/></clipPath>

    <style>
      .pulse  { animation: pulse 3.2s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
      .pulse2 { animation: pulse 4.1s ease-in-out infinite; }
      .pulse3 { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      .shimmer { animation: shim 5s ease-in-out infinite; }
      @keyframes shim { 0%,100%{stroke-opacity:.08} 50%{stroke-opacity:.4} }
      .drift1 { animation: d1 16s ease-in-out infinite alternate; }
      .drift2 { animation: d2 19s ease-in-out infinite alternate; }
      .drift3 { animation: d3 22s ease-in-out infinite alternate; }
      .drift4 { animation: d4 18s ease-in-out infinite alternate; }
      @keyframes d1 { from{transform:translate(0,0)} to{transform:translate(60px,40px)} }
      @keyframes d2 { from{transform:translate(0,0)} to{transform:translate(-70px,-30px)} }
      @keyframes d3 { from{transform:translate(0,0)} to{transform:translate(40px,-50px)} }
      @keyframes d4 { from{transform:translate(0,0)} to{transform:translate(-40px,40px)} }
      .blink { animation: blink 1.8s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.25} }
      .fadeup { animation: fadeup 1.1s ease-out both; }
      .fadeup2{ animation: fadeup 1.1s ease-out .25s both; }
      .fadeup3{ animation: fadeup 1.1s ease-out .45s both; }
      @keyframes fadeup { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
      .draw { stroke-dasharray:560; stroke-dashoffset:560; animation: draw 2.4s ease-out .5s forwards, shim2 6s ease-in-out 3s infinite; }
      @keyframes draw { to{stroke-dashoffset:0} }
      @keyframes shim2 { 0%,100%{opacity:.6} 50%{opacity:1} }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <!-- canvas -->
    <rect width="1280" height="440" fill="#06070c"/>

    <!-- drifting colour field -->
    <g filter="url(#soft)">
      <circle class="drift1" cx="250"  cy="120" r="230" fill="url(#blobV)"/>
      <circle class="drift2" cx="1010" cy="300" r="260" fill="url(#blobC)"/>
      <circle class="drift3" cx="720"  cy="410" r="220" fill="url(#blobA)"/>
      <circle class="drift4" cx="1140" cy="90"  r="190" fill="url(#blobR)"/>
    </g>
    <rect width="1280" height="440" fill="#06070c" opacity=".38"/>

    <!-- particle network -->
    <g stroke="url(#iris)" stroke-width="1">
      <line class="shimmer" x1="120" y1="80"  x2="300" y2="140"/>
      <line class="shimmer" x1="300" y1="140" x2="180" y2="300"/>
      <line class="shimmer" x1="300" y1="140" x2="420" y2="90"/>
      <line class="shimmer" x1="420" y1="90"  x2="520" y2="300"/>
      <line class="shimmer" x1="700" y1="120" x2="860" y2="200"/>
      <line class="shimmer" x1="860" y1="200" x2="960" y2="90"/>
      <line class="shimmer" x1="960" y1="90"  x2="1140" y2="150"/>
      <line class="shimmer" x1="1140" y1="150" x2="1180" y2="300"/>
      <line class="shimmer" x1="860" y1="200" x2="1040" y2="330"/>
      <line class="shimmer" x1="520" y1="300" x2="640" y2="360"/>
      <line class="shimmer" x1="180" y1="300" x2="380" y2="380"/>
      <line class="shimmer" x1="1040" y1="330" x2="1180" y2="300"/>
    </g>
    <g fill="#cfe9ff">
      <circle class="pulse"  cx="120"  cy="80"  r="2.6"/>
      <circle class="pulse2" cx="300"  cy="140" r="3.4"/>
      <circle class="pulse3" cx="180"  cy="300" r="2.8"/>
      <circle class="pulse"  cx="420"  cy="90"  r="3"/>
      <circle class="pulse2" cx="520"  cy="300" r="3.2"/>
      <circle class="pulse3" cx="700"  cy="120" r="2.6"/>
      <circle class="pulse"  cx="640"  cy="360" r="3"/>
      <circle class="pulse2" cx="860"  cy="200" r="3.6"/>
      <circle class="pulse3" cx="960"  cy="90"  r="3"/>
      <circle class="pulse"  cx="1040" cy="330" r="3.2"/>
      <circle class="pulse2" cx="1140" cy="150" r="2.8"/>
      <circle class="pulse3" cx="1180" cy="300" r="3"/>
      <circle class="pulse"  cx="380"  cy="380" r="2.6"/>
    </g>

    <!-- travelling signals along the graph -->
    <circle r="3.2" fill="#fff">
      <animateMotion dur="4s" repeatCount="indefinite" path="M300,140 L420,90 L520,300 L640,360"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#22d3ee">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M960,90 L1140,150 L1180,300 L1040,330 L860,200"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>

    <!-- wordmark -->
    <g class="fadeup" filter="url(#glow)">
      <text x="74" y="258" font-size="170" font-weight="800" letter-spacing="-4"
            fill="url(#sweep)">LATENT</text>
    </g>
    <line class="draw" x1="80" y1="286" x2="640" y2="286" stroke="url(#iris)" stroke-width="3" stroke-linecap="round"/>

    <!-- taglines -->
    <text class="fadeup2" x="82" y="338" font-size="22" letter-spacing="7" fill="#c7cce0" font-weight="600">A GENERATIVE ART STUDIO</text>
    <text class="fadeup3" x="82" y="372" font-size="16.5" letter-spacing="1.5" fill="#7e85a3" font-family="'Cascadia Code',Consolas,monospace">specimens from the latent space — emergence, rendered in the browser</text>

    <!-- corner marks -->
    <text x="82" y="56" font-size="13" letter-spacing="4" fill="#6c7390" font-family="monospace">LATENT.STUDIO</text>
    <g transform="translate(1198,50)" text-anchor="end">
      <circle cx="-128" cy="-4" r="4" fill="#22d3ee" class="blink"/>
      <text x="-140" y="0" font-size="13" letter-spacing="3" fill="#9aa2bd" font-family="monospace">LIVE</text>
      <text x="0" y="0" font-size="13" letter-spacing="3" fill="#6c7390" font-family="monospace">EST. 2026</text>
    </g>
    <text x="1198" y="404" text-anchor="end" font-size="12.5" letter-spacing="3" fill="#5a607b" font-family="monospace">001 · 002 · 003 · 004</text>

    <!-- frame -->
    <rect x="1" y="1" width="1278" height="438" rx="21" fill="none" stroke="url(#iris)" stroke-opacity=".35" stroke-width="1.5"/>
  </g>
</svg>

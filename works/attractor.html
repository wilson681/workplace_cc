<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strange Attractors — LATENT</title>
<meta name="description" content="A deterministic point system that never repeats. de Jong, Clifford and Svensson attractors rendered as luminous density.">
<meta name="theme-color" content="#05060a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/studio.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%237c5cff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2322d3ee'/%3E%3C/svg%3E">
</head>
<body>

<div class="stage"><canvas id="c"></canvas></div>

<a class="back" href="../index.html#works">← studio</a>

<div class="toolbar">
  <button class="tool" id="randomize" title="New attractor (R)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7M21 16v5h-5M14 14l7 7M3 8V3h5M10 10 3 3"/></svg>
  </button>
  <button class="tool" id="save" title="Save PNG (S)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
  </button>
  <button class="tool" id="play" title="Pause (space)">
    <svg viewBox="0 0 24 24" fill="currentColor" id="play-icon"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
  <button class="tool" id="fs" title="Fullscreen (F)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<div class="hud">
  <div class="label"><span class="dot">001</span> · CHAOS</div>
  <h1>Strange Attractors</h1>
  <p>One point, iterated forever by a pair of equations. It is perfectly deterministic, yet it never lands and never repeats — tracing a shape no one designed. Move your mouse to lean on the field.</p>
</div>

<div class="panel" id="panel">
  <h4>Parameters</h4>
  <div class="ctrl">
    <label>System</label>
    <div class="chips" id="systems">
      <button class="chip on" data-sys="dejong">de Jong</button>
      <button class="chip" data-sys="clifford">Clifford</button>
      <button class="chip" data-sys="svensson">Svensson</button>
    </div>
  </div>
  <div class="ctrl">
    <label>Palette</label>
    <div class="chips" id="palettes">
      <button class="chip on" data-pal="0">iris</button>
      <button class="chip" data-pal="1">ember</button>
      <button class="chip" data-pal="2">abyss</button>
      <button class="chip" data-pal="3">bloom</button>
    </div>
  </div>
  <div class="ctrl">
    <label>Density <span class="val" id="vDensity">40k</span></label>
    <input type="range" id="density" min="8" max="120" value="40">
  </div>
  <div class="ctrl">
    <label>Evolution <span class="val" id="vEvo">slow</span></label>
    <input type="range" id="evo" min="0" max="100" value="22">
  </div>
  <div class="ctrl">
    <label>Trail <span class="val" id="vTrail">0.06</span></label>
    <input type="range" id="trail" min="1" max="40" value="6">
  </div>
</div>

<script src="../assets/studio.js"></script>
<script>
(() => {
  const { fitCanvas, clamp, toggleFullscreen } = Studio;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d', { alpha: false });
  let W, H, DPR, cx, cy, scale;

  // ---- attractor systems ------------------------------------------------
  const systems = {
    dejong: { range: 2.05, fn: (x, y, p) => [
      Math.sin(p.a * y) - Math.cos(p.b * x),
      Math.sin(p.c * x) - Math.cos(p.d * y) ] },
    clifford: { range: 2.6, fn: (x, y, p) => [
      Math.sin(p.a * y) + p.c * Math.cos(p.a * x),
      Math.sin(p.b * x) + p.d * Math.cos(p.b * y) ] },
    svensson: { range: 1.9, fn: (x, y, p) => [
      p.d * Math.sin(p.a * x) - Math.sin(p.b * y),
      p.c * Math.cos(p.a * x) + Math.cos(p.b * y) ] },
  };

  // ---- palettes (hsl stops) --------------------------------------------
  const palettes = [
    [[262,85,64],[190,90,60],[40,95,62],[330,90,66]],   // iris
    [[20,95,58],[42,98,60],[8,90,55],[300,70,55]],       // ember
    [[228,80,55],[260,75,52],[200,85,58],[180,70,60]],   // abyss
    [[315,85,66],[280,80,64],[210,85,62],[150,75,58]],   // bloom
  ];
  let palette = palettes[0];
  const palAt = (t) => {                       // smooth ramp through stops
    t = (t % 1 + 1) % 1; const n = palette.length, f = t * n, i = Math.floor(f), k = f - i;
    const a = palette[i % n], b = palette[(i + 1) % n];
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  };

  // ---- state ------------------------------------------------------------
  const state = {
    sys: 'dejong', p: {}, target: {}, x: 0.1, y: 0.1,
    density: 40000, evo: 0.22, trail: 0.06, hueShift: 0,
    playing: true, t: 0,
  };
  const mouse = { x: 0, y: 0, on: false, fx: 0, fy: 0 };

  function rand(a, b) { return a + Math.random() * (b - a); }
  function newParams(into) {
    // pick coefficients that tend to give rich, non-degenerate forms
    into.a = rand(-2.6, 2.6); into.b = rand(-2.6, 2.6);
    into.c = rand(-2.2, 2.2); into.d = rand(-2.2, 2.2);
  }
  function reseed(hard) {
    newParams(state.target);
    if (hard) { Object.assign(state.p, state.target); state.x = 0.1; state.y = 0.1; flash(); }
  }
  function flash() { ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H); }

  function resize() {
    const r = fitCanvas(cv, { cap: 2 }); W = r.w; H = r.h; DPR = r.dpr;
    cx = W / 2; cy = H / 2; scale = Math.min(W, H) / (systems[state.sys].range * 2);
    flash();
  }
  addEventListener('resize', resize);

  // ---- render -----------------------------------------------------------
  function frame() {
    state.t += 0.016;
    // ease params toward target for continuous morph
    const ev = state.evo;
    if (ev > 0) {
      for (const k of 'abcd') state.p[k] += (state.target[k] - state.p[k]) * 0.012 * (0.2 + ev * 4);
      if (Math.abs(state.p.a - state.target.a) < 0.02 && Math.abs(state.p.b - state.target.b) < 0.02) newParams(state.target);
    }
    state.hueShift += 0.05 + ev * 0.6;

    // mouse force easing
    mouse.fx += ((mouse.on ? mouse.x : 0) - mouse.fx) * 0.06;
    mouse.fy += ((mouse.on ? mouse.y : 0) - mouse.fy) * 0.06;
    const warpX = mouse.on ? (mouse.fx / W - 0.5) * 0.6 : 0;
    const warpY = mouse.on ? (mouse.fy / H - 0.5) * 0.6 : 0;

    // fade (trail)
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = `rgba(5,6,10,${state.trail})`;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    const fn = systems[state.sys].fn, p = state.p;
    let x = state.x, y = state.y;
    const N = state.density;
    const a2 = 0.5 * DPR; // point size

    for (let i = 0; i < N; i++) {
      const [nx, ny] = fn(x, y, p);
      x = nx + warpX * Math.sin(ny * 1.7);
      y = ny + warpY * Math.cos(nx * 1.7);
      // discard the first few while it settles onto the attractor
      if (i > 12) {
        const sx = cx + x * scale, sy = cy + y * scale;
        const speed = Math.min(1, Math.hypot(nx - x, ny - y) * 0.6 + Math.abs(x) * 0.18);
        const [h, s, l] = palAt(speed * 0.7 + state.hueShift / 360 + i / N * 0.15);
        ctx.fillStyle = `hsla(${h},${s}%,${l}%,0.42)`;
        ctx.fillRect(sx, sy, a2, a2);
      }
    }
    state.x = x; state.y = y;

    if (state.playing) requestAnimationFrame(frame);
  }

  // ---- controls ---------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  $('systems').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    [...$('systems').children].forEach((c) => c.classList.toggle('on', c === b));
    state.sys = b.dataset.sys; scale = Math.min(W, H) / (systems[state.sys].range * 2);
    reseed(true);
  });
  $('palettes').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    [...$('palettes').children].forEach((c) => c.classList.toggle('on', c === b));
    palette = palettes[+b.dataset.pal];
  });
  $('density').addEventListener('input', (e) => {
    state.density = +e.target.value * 1000; $('vDensity').textContent = e.target.value + 'k';
  });
  $('evo').addEventListener('input', (e) => {
    state.evo = +e.target.value / 100; const v = +e.target.value;
    $('vEvo').textContent = v === 0 ? 'frozen' : v < 30 ? 'slow' : v < 70 ? 'flowing' : 'restless';
  });
  $('trail').addEventListener('input', (e) => {
    state.trail = +e.target.value / 100; $('vTrail').textContent = state.trail.toFixed(2);
  });

  $('randomize').addEventListener('click', () => reseed(true));
  $('save').addEventListener('click', () => {
    const a = document.createElement('a');
    a.download = `latent-attractor-${Date.now()}.png`; a.href = cv.toDataURL('image/png'); a.click();
  });
  $('play').addEventListener('click', togglePlay);
  $('fs').addEventListener('click', toggleFullscreen);

  function togglePlay() {
    state.playing = !state.playing;
    $('play-icon').innerHTML = state.playing
      ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
      : '<path d="M7 4l13 8-13 8z"/>';
    if (state.playing) frame();
  }

  addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key.toLowerCase() === 'r') reseed(true);
    else if (e.key.toLowerCase() === 's') $('save').click();
    else if (e.key.toLowerCase() === 'f') toggleFullscreen();
    else if (e.key.toLowerCase() === 'h') $('panel').classList.toggle('hidden');
  });

  cv.addEventListener('pointermove', (e) => { mouse.x = e.clientX * DPR; mouse.y = e.clientY * DPR; mouse.on = true; });
  cv.addEventListener('pointerleave', () => mouse.on = false);
  Studio.visibilityGate(() => { if (state.playing) frame(); }, () => { });

  // ---- go ---------------------------------------------------------------
  resize(); reseed(true); frame();
})();
</script>
</body>
</html>
